[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecity"
version = "0.1.0"
description = "SimCity-inspired polyglot visual time-machine for Git repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "polars>=1.19.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "ruff>=0.11.0",
    "sse-starlette>=2.2.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
semantic = [
    "markitdown>=0.1.0",
]
dev = [
    "playwright>=1.50.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
codecity = "codecity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/codecity"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
